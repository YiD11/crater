apiVersion: v1
kind: Service
metadata:
  name: crater-backend-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: crater-backend
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: crater-volcano-extender-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: crater-backend
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089
